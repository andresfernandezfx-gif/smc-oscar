  function readScreenshotWithAI(apiKey) {
    if (!state.screenshotDataUrl) return;
    state.aiReading = true; state.aiError = null; state.aiNote = null;
    renderTools();

    var m = /^data:(image\/[a-zA-Z0-9.+-]+);base64,(.+)$/.exec(state.screenshotDataUrl);
    if (!m) {
      state.aiReading = false; state.aiError = 'No se pudo leer la imagen cargada.';
      renderTools(); return;
    }
    var mediaType = m[1], base64Data = m[2];
    var sysPrompt = 'Eres un analista experto en Smart Money Concepts (SMC/ICT) leyendo una captura de un gráfico de forex. ' +
      'Responde SOLO con un objeto JSON (sin texto extra, sin markdown, sin backticks) con esta forma exacta: ' +
      '{"bias":"BULLISH|BEARISH|NEUTRAL","direction":"LONG|SHORT","structure":"string breve (HH/HL, BOS, CHoCH que veas)",' +
      '"obNote":"string breve describiendo el Order Block visible y su rango de precio aproximado","fvgNote":"string breve del FVG/imbalance visible",' +
      '"entry":"precio numérico como string o vacío si no es claro","sl":"precio numérico como string o vacío","tp":"precio numérico como string o vacío",' +
      '"notes":"otras confluencias visibles: liquidity sweep, premium/discount, killzone, etc","confidence":"ALTA|MEDIA|BAJA",' +
      '"caveat":"advertencia breve si algo de la imagen no se ve con claridad (ej: precios no legibles, gráfico cortado)"}. ' +
      'Si no puedes leer un precio exacto con confianza, deja ese campo vacío en vez de inventarlo — nunca inventes números.';

    fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: sysPrompt,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64Data } },
            { type: 'text', text: 'Lee este gráfico de forex y devuelve el JSON pedido.' }
          ]
        }]
      })
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          throw new Error('HTTP ' + res.status + ' — revisa tu API key/billing. ' + t.slice(0, 200));
        });
      }
      return res.json();
    }).then(function (data) {
      var textBlock = (data.content || []).filter(function (b) { return b.type === 'text'; }).map(function (b) { return b.text; }).join('\n');
      var clean = textBlock.replace(/```json|```/g, '').trim();
      var parsed;
      try { parsed = JSON.parse(clean); }
      catch (e) { throw new Error('La IA no devolvió JSON válido. Intenta de nuevo o completa manualmente.'); }

      state.shotAnalysis = {
        bias: ['BULLISH', 'BEARISH', 'NEUTRAL'].indexOf(parsed.bias) >= 0 ? parsed.bias : 'NEUTRAL',
        direction: parsed.direction === 'SHORT' ? 'SHORT' : 'LONG',
        structure: parsed.structure || '',
        obNote: parsed.obNote || '',
        fvgNote: parsed.fvgNote || '',
        entry: parsed.entry || '',
        sl: parsed.sl || '',
        tp: parsed.tp || '',
        notes: (parsed.notes || '') + (parsed.caveat ? ' · ⚠️ ' + parsed.caveat : '')
      };
      state.aiReading = false;
      state.aiNote = '✓ Captura leída (confianza IA: ' + (parsed.confidence || '?') + '). Revisa los campos antes de analizar — la IA puede errar en precios exactos.';
      renderTools();
    }).catch(function (err) {
      state.aiReading = false;
      state.aiError = 'No se pudo leer con IA: ' + (err && err.message ? err.message : 'error desconocido') + '. Completa manualmente abajo.';
      renderTools();
    });
  }

  function analyzeScreenshot(sa) {
    sa = sa || {};
    var conf = [];
    var bias = sa.bias || 'NEUTRAL';
    var dir = sa.direction || (bias === 'BEARISH' ? 'SHORT' : bias === 'BULLISH' ? 'LONG' : 'LONG');
    var score = 35;

    if (bias === 'BULLISH' || bias === 'BEARISH') {
      score += 20;
      conf.push('Bias ' + bias + ' leído en la captura de TradingView');
    } else {
      conf.push('Bias neutral en la captura — riesgo de operar sin dirección HTF');
    }
    if (sa.structure && sa.structure.trim()) {
      score += 12;
      conf.push('Estructura anotada: ' + sa.structure.trim());
    }
    if (sa.obNote && sa.obNote.trim()) {
      score += 15;
      conf.push('Order Block identificado: ' + sa.obNote.trim());
    }
    if (sa.fvgNote && sa.fvgNote.trim()) {
      score += 12;
      conf.push('FVG / imbalance: ' + sa.fvgNote.trim());
    }
    if (sa.notes && sa.notes.trim()) {
      score += 8;
      conf.push('Confluencias extra: ' + sa.notes.trim());
    }
    if (sa.entry && sa.sl && sa.tp) score += 10;
    score = Math.min(score, 96);

    var summary = '';
    if (score >= 70) {
      summary = 'La captura muestra un setup SMC con buena confluencia (score ~' + score + '). Bias alineado con zona de interés (OB/FVG). ';
      summary += 'Valida que el SL quede detrás de la estructura y que el TP busque liquidez opuesta. No operes solo por la imagen: confirma en vivo el precio de tu bróker (OANDA/FXCM).';
    } else if (score >= 50) {
      summary = 'Setup intermedio (score ~' + score + '). Hay elementos SMC, pero faltan confluencias o niveles precisos. ';
      summary += 'Espera confirmación (displacement, CHoCH en LTF o rechazo claro en el OB) antes de entrar.';
    } else {
      summary = 'Confluencia baja (score ~' + score + '). Completa bias, estructura, OB/FVG y niveles Entry/SL/TP según lo que ves en TV para un análisis útil.';
    }

    var entry = num(sa.entry); if (isNaN(entry)) entry = 0;
    var sl = num(sa.sl); if (isNaN(sl)) sl = 0;
    var tp = num(sa.tp); if (isNaN(tp)) tp = 0;
    var entryWhy = entry
      ? 'Entry tomado de tu lectura de la captura (OB/FVG/OTE en el chart de TV).'
      : 'Define Entry en la zona del OB o 50% del FVG que ves en la captura.';
    var slWhy = sl
      ? 'SL detrás de la estructura/OB de la captura. Si el precio lo rompe con cuerpo, la idea queda invalidada.'
      : 'Coloca SL más allá del OB o del swing que invalida el setup en tu captura.';
    var tpWhy = tp
      ? 'TP hacia liquidez opuesta o swing relevante marcado en tu chart de TV.'
      : 'Objetivo en equal highs/lows o swing opuesto visible en la captura.';

    if (entry && sl && dir === 'LONG' && sl >= entry) {
      conf.push('Atención: en LONG el SL debería estar por debajo del Entry');
    }
    if (entry && sl && dir === 'SHORT' && sl <= entry) {
      conf.push('Atención: en SHORT el SL debería estar por encima del Entry');
    }

    return {
      summary: summary,
      confluences: conf,
      score: score,
      direction: dir,
      entry: entry || '',
      sl: sl || '',
      tp: tp || '',
      entryWhy: entryWhy,
      slWhy: slWhy,
      tpWhy: tpWhy
    };
  }

  /* ========== BACKTEST SMC ========== */
  function runBacktest(candles, pair, tf) {
    var results = [];
    if (!candles || candles.length < 40) {
      return { trades: [], stats: null, error: 'Pocas velas para backtest (mín. 40)' };
    }
    var minBars = 30;
    var cooldown = 0;
    var i, slice, full, c, entry, sl, tp, dir, j, hit, risk, reward, rr, st, score;
    // Muestreo: cada vela (con cooldown tras entrada) — sin look-ahead

    for (i = minBars; i < candles.length - 2; i++) {
      if (cooldown > 0) { cooldown--; continue; }

      // Recalcula el motor SMC completo (estructura, liquidez, rango, OB/FVG y
      // el setup engine real) usando SOLO las velas conocidas hasta ese punto,
      // igual que el análisis en vivo — así no hay look-ahead bias.
      slice = candles.slice(0, i + 1);
      full = runFullSMC(slice, pair, tf, { backtest: true });
      st = { bias: full.bias };
      score = full.score;
      c = full.setup || {};

      if (!c.hasSetup || !c.entry || !c.sl || !c.tp) continue;

      entry = +c.entry; sl = +c.sl; tp = +c.tp; dir = c.dir;
      if (!entry || !sl || !tp || Math.abs(entry - sl) < 1e-10) continue;

      // Validar dirección del SL/TP
      if (dir === 'LONG' && !(sl < entry && tp > entry)) continue;
      if (dir === 'SHORT' && !(sl > entry && tp < entry)) continue;

      risk = Math.abs(entry - sl);
      reward = Math.abs(tp - entry);
      rr = risk > 0 ? reward / risk : 0;

      hit = null;
      var exitBar = null, exitPrice = null, exitReason = '';
      for (j = i + 1; j < candles.length; j++) {
        var bar = candles[j];
        if (dir === 'LONG') {
          if (bar.low <= sl) { hit = 'LOSS'; exitBar = j; exitPrice = sl; exitReason = 'SL tocado'; break; }
          if (bar.high >= tp) { hit = 'WIN'; exitBar = j; exitPrice = tp; exitReason = 'TP alcanzado'; break; }
        } else {
          if (bar.high >= sl) { hit = 'LOSS'; exitBar = j; exitPrice = sl; exitReason = 'SL tocado'; break; }
          if (bar.low <= tp) { hit = 'WIN'; exitBar = j; exitPrice = tp; exitReason = 'TP alcanzado'; break; }
        }
      }
      if (!hit) {
        hit = 'OPEN';
        exitBar = candles.length - 1;
        exitPrice = candles[exitBar].close;
        exitReason = 'Sin cierre (fin del sample)';
      }

      var pnlR = hit === 'WIN' ? +(rr).toFixed(2) : hit === 'LOSS' ? -1 : 0;
      var entryTime = candles[i].time;
      var exitTime = candles[exitBar] ? candles[exitBar].time : null;
      var barsHeld = exitBar != null ? (exitBar - i) : 0;

      results.push({
        id: results.length + 1,
        bar: i,
        exitBar: exitBar,
        barsHeld: barsHeld,
        dir: dir,
        entry: entry,
        sl: sl,
        tp: tp,
        exitPrice: exitPrice,
        exitReason: exitReason,
        entryTime: entryTime,
        exitTime: exitTime,
        rr: +rr.toFixed(2),
        result: hit,
        pnlR: pnlR,
        score: score,
        bias: st.bias,
        conf: c.conf ? c.conf.slice() : [],
        entryWhy: c.entryWhy || '',
        slWhy: c.slWhy || '',
        tpWhy: c.tpWhy || '',
        why: c.why || ''
      });
      cooldown = 5; // más señales en muestra limitada
    }

    var closed = results.filter(function (t) { return t.result === 'WIN' || t.result === 'LOSS'; });
    var wins = closed.filter(function (t) { return t.result === 'WIN'; });
    var losses = closed.filter(function (t) { return t.result === 'LOSS'; });
    var openT = results.filter(function (t) { return t.result === 'OPEN'; });
    var totalR = closed.reduce(function (a, t) { return a + t.pnlR; }, 0);
    var winrate = closed.length ? (wins.length / closed.length * 100) : 0;
    var avgWin = wins.length ? wins.reduce(function (a, t) { return a + t.pnlR; }, 0) / wins.length : 0;
    var avgLoss = losses.length ? Math.abs(losses.reduce(function (a, t) { return a + t.pnlR; }, 0) / losses.length) : 1;
    var profitFactor = (losses.length && avgLoss)
      ? (wins.reduce(function (a, t) { return a + t.pnlR; }, 0) / (losses.length * avgLoss))
      : (wins.length ? Infinity : 0);
    var longs = closed.filter(function (t) { return t.dir === 'LONG'; });
    var shorts = closed.filter(function (t) { return t.dir === 'SHORT'; });
    var longWR = longs.length ? longs.filter(function (t) { return t.result === 'WIN'; }).length / longs.length * 100 : 0;
    var shortWR = shorts.length ? shorts.filter(function (t) { return t.result === 'WIN'; }).length / shorts.length * 100 : 0;
    var avgRR = closed.length ? closed.reduce(function (a, t) { return a + t.rr; }, 0) / closed.length : 0;

    // Max drawdown en R
    var equity = 0, peak = 0, maxDD = 0;
    closed.forEach(function (t) {
      equity += t.pnlR;
      if (equity > peak) peak = equity;
      var dd = peak - equity;
      if (dd > maxDD) maxDD = dd;
    });

    return {
      trades: results,
      stats: {
        totalSignals: results.length,
        closed: closed.length,
        wins: wins.length,
        losses: losses.length,
        open: openT.length,
        winrate: +winrate.toFixed(1),
        totalR: +totalR.toFixed(2),
        avgWin: +avgWin.toFixed(2),
        avgLoss: +avgLoss.toFixed(2),
        profitFactor: profitFactor === Infinity ? '∞' : +profitFactor.toFixed(2),
        avgRR: +avgRR.toFixed(2),
        longWR: +longWR.toFixed(1),
        shortWR: +shortWR.toFixed(1),
        longN: longs.length,
        shortN: shorts.length,
        maxDD: +maxDD.toFixed(2),
        expectancy: closed.length ? +((winrate / 100) * avgWin - (1 - winrate / 100) * avgLoss).toFixed(3) : 0
      },
      error: null
    };
  }

  function renderBacktest() {

      html += '<div class="stat"><div class="val">' + s.totalSignals + '</div><div class="lbl">Señales</div></div>';
      html += '</div>';

      html += '<div class="card"><div class="card-header">Desglose</div>';
      html += '<div class="factor"><span>Winrate LONG</span><span>' + s.longWR + '% <span style="color:var(--muted)">(' + s.longN + ')</span></span></div>';
      html += '<div class="factor"><span>Winrate SHORT</span><span>' + s.shortWR + '% <span style="color:var(--muted)">(' + s.shortN + ')</span></span></div>';
      html += '<div class="factor"><span>Avg win</span><span style="color:var(--green)">+' + s.avgWin + 'R</span></div>';
      html += '<div class="factor"><span>Avg loss</span><span style="color:var(--red)">-' + s.avgLoss + 'R</span></div>';
      html += '<div class="factor"><span>Abiertos al final</span><span>' + s.open + '</span></div></div>';

      // Interpretación trader
      html += '<div class="card"><div class="card-header">Lectura del resultado</div>';
      var note = '';
      if (s.closed < 10) {
        note = 'Muestra pequeña (<10 trades). El winrate aún no es estadísticamente fiable. Pulsa LIVE, cambia a 1h/4h y vuelve a ejecutar; o espera a que cargue historial extendido.';
      } else if (s.winrate >= 50 && s.totalR > 0 && s.expectancy > 0) {
        note = 'La lógica SMC actual muestra edge positivo en esta muestra: winrate ' + s.winrate +
          '% y expectancy ' + s.expectancy + 'R. Sigue validando en forward test y con tu bróker (OANDA/FXCM).';
      } else if (s.winrate >= 45 && s.totalR >= 0) {

          if (open) {

            function fmtT(ts) {

              try { return new Date(ts * 1000).toLocaleString(); } catch (e) { return String(ts); }

            html += '<div class="factor"><span>RR planificado</span><span>' + tr.rr + '</span></div>';
            html += '<div style="margin-top:8px"><strong style="color:var(--cyan)">¿Por qué el trade?</strong><p style="color:var(--muted);margin:4px 0 0">' + escapeHtml(tr.why || '—') + '</p></div>';
            html += '<div style="margin-top:8px"><strong>Confluencias</strong><ul class="list">';
            (tr.conf || []).forEach(function (cf) { html += '<li>' + escapeHtml(cf) + '</li>'; });
            if (!tr.conf || !tr.conf.length) html += '<li>Sin detalle</li>';
            html += '</ul></div>';
            html += '<div style="margin-top:8px;color:var(--muted)">';
            html += '<div><strong style="color:var(--cyan)">Entry:</strong> ' + escapeHtml(tr.entryWhy || '—') + '</div>';
            html += '<div style="margin-top:4px"><strong style="color:var(--red)">SL:</strong> ' + escapeHtml(tr.slWhy || '—') + '</div>';
            html += '<div style="margin-top:4px"><strong style="color:var(--green)">TP:</strong> ' + escapeHtml(tr.tpWhy || '—') + '</div>';
            html += '</div>';

            html += '</div>';
          }
          html += '</div>';
        });
        html += '</div>';
      }
    }

    document.getElementById('panel-backtest').innerHTML = html;
    var btn = document.getElementById('btnRunBT');
    if (btn) btn.onclick = function () {
      btn.textContent = '📡 Descargando historial extendido…';
      btn.disabled = true;
      var finished = false;
      function finishBT(ext) {
        if (finished) return;
        finished = true;
        var srcCandles = state.candles;
        var usedExtended = false;
        if (ext && ext.candles && ext.candles.length > (state.candles ? state.candles.length : 0)) {
          srcCandles = ext.candles;
          usedExtended = true;
        }
        // Si hay poca data, usar seed del par/TF
        if ((!srcCandles || srcCandles.length < 60)) {
          var seed = getSeedCandles(state.pair, state.tf);
          if (seed && seed.length > (srcCandles ? srcCandles.length : 0)) srcCandles = seed;
        }
        btn.textContent = '⚙️ Calculando sobre ' + (srcCandles ? srcCandles.length : 0) + ' velas…';
        setTimeout(function () {
          try {
            var out = runBacktest(srcCandles, state.pair, state.tf);
            state.btError = out.error;
            state.btStats = out.stats;
            state.btTrades = out.trades || [];
            state.btOpenId = null;
            state.btCandlesUsed = srcCandles ? srcCandles.length : 0;
            state.btUsedExtended = usedExtended;
          } catch (err) {
            state.btError = String(err && err.message || err);
            state.btStats = null;
            state.btTrades = [];
          }
          renderBacktest();
        }, 20);
      }
      // Timeout 10s: no bloquear UI si proxies fallan
      var to = setTimeout(function () { finishBT(null); }, 10000);
      fetchBacktestCandles(state.pair, state.tf).then(function (ext) {
        clearTimeout(to);
        finishBT(ext);
      }).catch(function () {
        clearTimeout(to);
        finishBT(null);
      });
    };
    function openTradeOnChart(id) {
      var tr = (state.btTrades || []).filter(function (x) { return x.id === id; })[0];
      if (!tr) return;
      state.btOpenId = id;
      state.btHighlight = { from: tr.bar, to: tr.exitBar != null ? tr.exitBar : tr.bar };
      setPlanLevels(tr.entry, tr.sl, tr.tp, tr.dir, true);
      switchTab('chart');
    }
    document.querySelectorAll('[data-btid]').forEach(function (el) {
      el.onclick = function (e) {
        var id = +el.getAttribute('data-btid');
        // clic en la fila → va al gráfico con la operación
        if (e.target.closest('[data-plot-bt]') || e.target.closest('[data-detail-bt]')) {
          return;
        }
        openTradeOnChart(id);
      };
    });
    document.querySelectorAll('[data-detail-bt]').forEach(function (el) {
      el.onclick = function (e) {
        e.stopPropagation();
        var id = +el.getAttribute('data-detail-bt');
        state.btOpenId = state.btOpenId === id ? null : id;
        renderBacktest();

  function sendTelegram(text, opts) {
    opts = opts || {};
    var force = !!opts.force; // prueba: ignora enabled
    if (!state.telegram) state.telegram = { token: '', chatId: '', enabled: false };
    if (!force && !state.telegram.enabled) return Promise.resolve({ ok: false, error: 'Telegram OFF' });

    var token = String(state.telegram.token || '').trim().replace(/\s+/g, '');
    var chat = String(state.telegram.chatId || '').trim().replace(/\s+/g, '');
    if (!token || token.indexOf(':') < 0) return Promise.resolve({ ok: false, error: 'Token inválido (debe ser 123456:AA...)' });
    if (!chat || !/^-?\d+$/.test(chat)) return Promise.resolve({ ok: false, error: 'Chat ID inválido (solo números, ej: 123456789)' });

    var plain = String(text || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    if (!plain) plain = 'SMC Oscar · test';
    if (plain.length > 3500) plain = plain.slice(0, 3500) + '...';

    var apiSend = 'https://api.telegram.org/bot' + token + '/sendMessage'
      + '?chat_id=' + encodeURIComponent(chat)
      + '&text=' + encodeURIComponent(plain)
      + '&disable_web_page_preview=true';

    function parseTg(txt) {
      if (!txt) return null;
      try {
        // allorigins envuelve en { contents: "..." }
        var j = JSON.parse(txt);
        if (j && typeof j.contents === 'string') {
          try { j = JSON.parse(j.contents); } catch (e) { return null; }
        }
        return j;
      } catch (e) {
        if (txt.indexOf('"ok":true') >= 0) return { ok: true };
        if (txt.indexOf('"ok":false') >= 0) return { ok: false, description: txt.slice(0, 200) };
        return null;
      }
    }

    function viaProxy(url) {
      var proxies = [
        'https://corsproxy.io/?' + encodeURIComponent(url),
        'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
        'https://api.allorigins.win/get?url=' + encodeURIComponent(url),
        'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url)
      ];
      function next(i) {
        if (i >= proxies.length) return Promise.resolve(null);
        return fetch(proxies[i], { method: 'GET', mode: 'cors', cache: 'no-store' })
          .then(function (r) { return r.text(); })
          .then(function (txt) {
            var j = parseTg(txt);
            if (j && j.ok === true) return j;
            if (j && j.ok === false) return j; // error real de Telegram (no reintentar)
            return next(i + 1);
          })
          .catch(function () { return next(i + 1); });
      }
      return next(0);
    }

    // Disparo no-cors (ayuda en algunos navegadores)
    try { fetch(apiSend, { method: 'GET', mode: 'no-cors', cache: 'no-store' }).catch(function () {}); } catch (e0) {}
    try {
      var img = new Image();
      img.src = apiSend + '&_ts=' + Date.now();
    } catch (e1) {}

    return viaProxy(apiSend).then(function (j) {
      if (j && j.ok === true) return { ok: true };
      if (j && j.ok === false) {
        var desc = j.description || 'Error API Telegram';
        // Errores típicos
        if (/chat not found/i.test(desc)) desc = 'Chat no encontrado: abre @SmcOscarbot, pulsa Start y usa el Chat ID de @userinfobot';
        if (/bot was blocked/i.test(desc)) desc = 'Bloqueaste el bot: desbloquéalo y pulsa Start';
        if (/unauthorized/i.test(desc)) desc = 'Token inválido o revocado. Genera uno nuevo en @BotFather';
        return { ok: false, error: desc };
      }
      // Sin confirmación por CORS: en modo prueba abrimos ventana para forzar envío visible
      if (force) {
        try {
          var w = window.open(apiSend, '_blank', 'noopener,noreferrer,width=520,height=320');
          if (w) return { ok: true, via: 'popup', note: 'Se abrió una pestaña con la respuesta de Telegram. Si dice ok:true, el mensaje llegó.' };
        } catch (e2) {}
        return { ok: false, error: 'No se pudo confirmar el envío (CORS). Prueba el botón "Enviar en pestaña" o usa HTTPS.' };
      }
      // Alertas automáticas: asumimos intento enviado
      return { ok: true, via: 'no-cors' };
    });
  }

  function journalStats(trades) {
    trades = trades || state.trades || [];
    var closed = trades.filter(function (t) { return t.result === 'WIN' || t.result === 'LOSS' || t.result === 'BE'; });
    var wins = closed.filter(function (t) { return t.result === 'WIN'; });
    var losses = closed.filter(function (t) { return t.result === 'LOSS'; });
    var totalR = closed.reduce(function (a, t) { return a + (Number(t.pnl) || 0); }, 0);
    var winR = wins.reduce(function (a, t) { return a + (Number(t.pnl) || 0); }, 0);
    var lossR = losses.reduce(function (a, t) { return a + Math.abs(Number(t.pnl) || 0); }, 0);
    var avgWin = wins.length ? winR / wins.length : 0;
    var avgLoss = losses.length ? lossR / losses.length : 0;
    var wr = closed.length ? (wins.length / closed.length) * 100 : 0;
    var pf = lossR > 0 ? winR / lossR : (winR > 0 ? 99 : 0);
    var exp = closed.length ? (wr / 100) * avgWin - (1 - wr / 100) * avgLoss : 0;
    var equity = 0, peak = 0, maxDD = 0;
    closed.slice().reverse().forEach(function (t) {
      equity += Number(t.pnl) || 0;
      if (equity > peak) peak = equity;
      var dd = peak - equity;
      if (dd > maxDD) maxDD = dd;
    });
    return {
      closed: closed.length, wins: wins.length, losses: losses.length,
      winrate: Math.round(wr * 10) / 10, totalR: +totalR.toFixed(2),
      avgWin: +avgWin.toFixed(2), avgLoss: +avgLoss.toFixed(2),
      profitFactor: +pf.toFixed(2), expectancy: +exp.toFixed(3), maxDD: +maxDD.toFixed(2)
    };
  }

  function isForexMarketOpen(date) {
    // Forex: abre domingo ~22:00 UTC, cierra viernes ~22:00 UTC
    var d = date || new Date();
    var day = d.getUTCDay(); // 0=Sun .. 5=Fri 6=Sat
    var h = d.getUTCHours() + d.getUTCMinutes() / 60;
    if (day === 6) return { open: false, label: 'Cerrado (sábado)' };
    if (day === 5 && h >= 22) return { open: false, label: 'Cerrado (vie 22:00 UTC)' };
    if (day === 0 && h < 22) return { open: false, label: 'Cerrado (dom antes 22:00 UTC)' };
    // Killzones informativas
    var kz = isInKillzone(d);
    var label = 'Forex abierto';
    if (kz.london) label = 'London session';
    if (kz.ny) label = 'NY session';
    if (kz.overlap) label = 'London/NY overlap';
    return { open: true, label: label, kz: kz };

  var idb = null;
  function openIDB() {
    return new Promise(function (resolve) {
      if (!window.indexedDB) { resolve(null); return; }
      try {
        var req = indexedDB.open('smc-edge-db', 1);
        req.onupgradeneeded = function (e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains('trades')) db.createObjectStore('trades', { keyPath: 'id', autoIncrement: true });
          if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
        };
        req.onsuccess = function (e) { idb = e.target.result; resolve(idb); };
        req.onerror = function () { resolve(null); };
      } catch (err) { resolve(null); }
    });
  }
  function idbGetTrades() {
    return openIDB().then(function (db) {
      if (!db) return state.trades || [];
      return new Promise(function (resolve) {
        try {
          var tx = db.transaction('trades', 'readonly');
          var req = tx.objectStore('trades').getAll();
          req.onsuccess = function () { resolve(req.result || []); };
          req.onerror = function () { resolve(state.trades || []); };
        } catch (e) { resolve(state.trades || []); }
      });
    });
  }
  function idbSaveTrades(trades) {
    state.trades = trades || [];
    try { idbSaveTrades(state.trades); } catch (e) {}
    return openIDB().then(function (db) {
      if (!db) return;
      return new Promise(function (resolve) {
        try {
          var tx = db.transaction('trades', 'readwrite');
          var store = tx.objectStore('trades');
          store.clear();
          (trades || []).forEach(function (t, i) {
            var row = Object.assign({}, t);
            if (row.id == null) row.id = i + 1;
            store.put(row);
          });
          tx.oncomplete = function () { resolve(); };
          tx.onerror = function () { resolve(); };
        } catch (e) { resolve(); }
      });
    });
  }

    var rows = [['id','pair','tf','dir','entry','sl','tp','result','rr','notes','date']];
    (state.trades || []).forEach(function (t, i) {
      rows.push([i+1, t.pair||'', t.tf||'', t.dir||'', t.entry||'', t.sl||'', t.tp||'', t.result||'', t.rr||'', (t.notes||'').replace(/"/g,"'"), t.date||'']);
    });
    var csv = rows.map(function (r) { return r.map(function (c) { return '"' + String(c) + '"'; }).join(','); }).join('\n');
    var blob = new Blob([csv], { type: 'text/csv' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'smc-edge-journal.csv';
    a.click();
  }
  function importJournalFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        var list = Array.isArray(data) ? data : (data.trades || []);
        if (!list.length) { alert('Archivo sin trades'); return; }
        idbSaveTrades((state.trades || []).concat(list)).then(function () {
          if (state.tab === 'journal') renderJournal();
          alert('Importados ' + list.length + ' trades');
        });
      } catch (e) { alert('JSON inválido'); }
    };
    reader.readAsText(file);
  }

  // —— Finnhub WebSocket Forex (requiere token gratis en localStorage smc-fh-token) ——
  function finnhubFxSymbol(pair) {
    // Forex only — never crypto
    var map = {
      EURUSD: 'OANDA:EUR_USD', GBPUSD: 'OANDA:GBP_USD', USDJPY: 'OANDA:USD_JPY',
      AUDUSD: 'OANDA:AUD_USD', USDCAD: 'OANDA:USD_CAD', USDCHF: 'OANDA:USD_CHF',
      NZDUSD: 'OANDA:NZD_USD', EURGBP: 'OANDA:EUR_GBP', EURJPY: 'OANDA:EUR_JPY',
      GBPJPY: 'OANDA:GBP_JPY', XAUUSD: 'OANDA:XAU_USD'
    };
    return map[pair] || ('OANDA:' + pair.slice(0,3) + '_' + pair.slice(3));
  }
  function stopForexWS() {
    if (state.ws.sock) {
      try { state.ws.sock.close(); } catch (e) {}
      state.ws.sock = null;
      state.ws.connected = false;
    }
  }
  function startForexWS() {
    stopForexWS();
    var token = '';
    try { token = localStorage.getItem('smc-fh-token') || ''; } catch (e) {}
    if (!token || !state.fxSession.open) return;
    if (typeof WebSocket === 'undefined') return;
    try {
      var sock = new WebSocket('wss://ws.finnhub.io?token=' + encodeURIComponent(token));
      state.ws.sock = sock;
      sock.onopen = function () {
        state.ws.connected = true;
        var sym = finnhubFxSymbol(state.pair);
        sock.send(JSON.stringify({ type: 'subscribe', symbol: sym }));
        state.liveSource = 'Finnhub FX WS';
        setDataSourceUI();
      };
      sock.onmessage = function (ev) {
        try {
          var msg = JSON.parse(ev.data);
          if (msg.type === 'trade' && msg.data && msg.data.length) {
            var last = msg.data[msg.data.length - 1];
            var px = last.p;
            if (px > 0) {
              state.ws.lastTick = px;
              applySpotToLastCandle(px);
              state.lastUpdateTs = Date.now();
              setDataSourceUI();
              if (state.tab === 'chart') drawChart();
            }
          }
        } catch (e) {}
      };
      sock.onclose = function () {
        state.ws.connected = false;
        // Reconnect if live and market open
        if (state.live && state.fxSession.open) {
          setTimeout(function () { startForexWS(); }, 5000);
        }
      };
      sock.onerror = function () { try { sock.close(); } catch (e) {} };
    } catch (e) {}
  }

  // —— Chart pan / pinch zoom ——
  function getVisibleCandles() {
    var all = state.candles || [];
    var n = all.length;
    if (!n) return { candles: [], start: 0 };
    var zoom = Math.max(0.4, Math.min(4, state.chartView.barZoom || 1));
    var visible = Math.max(20, Math.min(n, Math.round(n / zoom)));
    var maxOff = Math.max(0, n - visible);
    var off = Math.max(0, Math.min(maxOff, state.chartView.barOffset || 0));
    state.chartView.barOffset = off;
    var start = Math.max(0, n - visible - off);
    var end = Math.min(n, start + visible);
    return { candles: all.slice(start, end), start: start, end: end };
  }

  function bindChartGestures() {
    var canvas = document.getElementById('chartCanvas');
    var wrap = document.getElementById('chartWrap');
    if (!canvas || canvas._gesturesBound) return;
    canvas._gesturesBound = true;
    var dragging = false, lastX = 0, lastY = 0;
    var pinchStartDist = 0, pinchStartZoom = 1;

    function priceFromY(clientY, h, padT, padB, minP, maxP) {
      var rect = canvas.getBoundingClientRect();
      var y = clientY - rect.top;
      var chartH = h - padT - padB;
      var t = (y - padT) / chartH;
      return maxP - t * (maxP - minP);
    }

    canvas.addEventListener('wheel', function (e) {
      e.preventDefault();
      var z = state.chartView.barZoom || 1;
      if (e.deltaY < 0) z *= 1.12; else z /= 1.12;
      state.chartView.barZoom = Math.max(0.4, Math.min(4, z));
      drawChart();
    }, { passive: false });

    canvas.addEventListener('pointerdown', function (e) {
      canvas.setPointerCapture(e.pointerId);
      var rect = canvas.getBoundingClientRect();
      var y = e.clientY - rect.top;
      var h = rect.height;
      // Hit-test plan levels for drag
      if (state.planLevels && state.layers.levels) {
        var vis = getVisibleCandles();
        var candles = vis.candles;
        if (candles.length) {
          var minP = Infinity, maxP = -Infinity, i;
          for (i = 0; i < candles.length; i++) {
            if (candles[i].low < minP) minP = candles[i].low;
            if (candles[i].high > maxP) maxP = candles[i].high;
          }
          var range = (maxP - minP) || 1;
          minP -= range * 0.06; maxP += range * 0.06;
          var padT = 48, padB = 10;
          function yOf(p) { return padT + (h - padT - padB) - ((p - minP) / (maxP - minP)) * (h - padT - padB); }
          var hits = [
            { k: 'entry', y: yOf(state.planLevels.entry) },
            { k: 'sl', y: yOf(state.planLevels.sl) },
            { k: 'tp', y: yOf(state.planLevels.tp) }
          ];
          for (i = 0; i < hits.length; i++) {
            if (Math.abs(y - hits[i].y) < 14) {
              state.dragLevel = hits[i].k;
              state.planLevels.auto = false;
              return;
            }
          }
        }
      }
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });
    canvas.addEventListener('pointermove', function (e) {
      if (state.dragLevel && state.planLevels) {
        var rect = canvas.getBoundingClientRect();
        var h = rect.height;
        var vis = getVisibleCandles();
        var candles = vis.candles;
        if (!candles.length) return;
        var minP = Infinity, maxP = -Infinity, i;
        for (i = 0; i < candles.length; i++) {
          if (candles[i].low < minP) minP = candles[i].low;
          if (candles[i].high > maxP) maxP = candles[i].high;
        }
        var range = (maxP - minP) || 1;
        minP -= range * 0.06; maxP += range * 0.06;
        var padT = 48, padB = 10;
        var chartH = h - padT - padB;
        var t = (e.clientY - rect.top - padT) / chartH;
        var px = maxP - t * (maxP - minP);
        var dec = (state.pair.indexOf('JPY') >= 0 || state.pair === 'XAUUSD') ? 2 : 5;
        px = +px.toFixed(dec);
        if (state.dragLevel === 'entry') state.planLevels.entry = px;
        if (state.dragLevel === 'sl') state.planLevels.sl = px;
        if (state.dragLevel === 'tp') state.planLevels.tp = px;
        // sync risk calc fields if visible
        try {
          var elE = document.getElementById('riskEntry');
          var elS = document.getElementById('riskSL');
          var elT = document.getElementById('riskTP');
          if (elE && state.dragLevel === 'entry') elE.value = String(px).replace('.', ',');
          if (elS && state.dragLevel === 'sl') elS.value = String(px).replace('.', ',');
          if (elT && state.dragLevel === 'tp') elT.value = String(px).replace('.', ',');
        } catch (err) {}
        drawChart();
        return;
      }
      if (!dragging) return;
      var dx = e.clientX - lastX;
      lastX = e.clientX;
      // arrastrar derecha = ver historia (aumentar offset)
      var bars = Math.round(dx / 6);
      if (bars !== 0) {
        state.chartView.barOffset = Math.max(0, (state.chartView.barOffset || 0) + bars);
        drawChart();
      }
    });
    canvas.addEventListener('pointerup', function () {
      dragging = false;
      state.dragLevel = null;
    });
    canvas.addEventListener('pointercancel', function () {
      dragging = false;
      state.dragLevel = null;
    });

    // Pinch zoom (2 fingers)
    var touches = {};
    canvas.addEventListener('touchstart', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        touches[t.identifier] = { x: t.clientX, y: t.clientY };
      }
      var ids = Object.keys(touches);
      if (ids.length === 2) {
        var a = touches[ids[0]], b = touches[ids[1]];
        pinchStartDist = Math.hypot(a.x - b.x, a.y - b.y);
        pinchStartZoom = state.chartView.barZoom || 1;
      }
    }, { passive: true });
    canvas.addEventListener('touchmove', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        touches[t.identifier] = { x: t.clientX, y: t.clientY };
      }
      var ids = Object.keys(touches);
      if (ids.length === 2 && pinchStartDist > 0) {
        e.preventDefault();
        var a = touches[ids[0]], b = touches[ids[1]];
        var dist = Math.hypot(a.x - b.x, a.y - b.y);
        var z = pinchStartZoom * (dist / pinchStartDist);
        state.chartView.barZoom = Math.max(0.4, Math.min(4, z));
        drawChart();
      }
    }, { passive: false });
    canvas.addEventListener('touchend', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) delete touches[e.changedTouches[i].identifier];
      if (Object.keys(touches).length < 2) pinchStartDist = 0;
    }, { passive: true });
  }


  // Boot pro features
  openIDB().then(function () { return idbGetTrades(); }).then(function (tr) {
    if (tr && tr.length) state.trades = tr;
  });
  updateFxSessionUI();
  setInterval(updateFxSessionUI, 60000);
  var _bem = document.getElementById('btnEntryMode');
  if (_bem) _bem.onclick = function (e) { e.preventDefault(); e.stopPropagation(); toggleEntryMode(); };
  try { var _em = localStorage.getItem('smc-entry-mode'); if (_em) state.entryMode = _em; } catch (e) {}
  updateEntryModeChip();
  var _ba = document.getElementById('btnAlerts');
  if (_ba) _ba.onclick = function (e) { e.preventDefault(); e.stopPropagation(); toggleAlerts(); };
  updateAlertChip();
  var _bem = document.getElementById('btnEntryMode');
  if (_bem) _bem.onclick = function (e) { e.preventDefault(); e.stopPropagation(); toggleEntryMode(); };
  try { var _em = localStorage.getItem('smc-entry-mode'); if (_em) state.entryMode = _em; } catch (e) {}
  updateEntryModeChip();
  var _ba = document.getElementById('btnAlerts');
  if (_ba) _ba.onclick = function (e) { e.preventDefault(); e.stopPropagation(); toggleAlerts(); };
  updateAlertChip();
  updateLayerChips();
  refreshData();
  setTimeout(function () { if (state.live) startForexWS(); }, 2000);

  // Registro del service worker para instalación como PWA (Windows/iOS).
  // Requiere que el archivo se sirva por http(s) — si se abre como file://
  // local, el navegador simplemente no soporta SW y esto no rompe nada.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* no disponible en file:// u origen no seguro, ok */ });
    });
  }
})();
