# SMC - Oscar FX · Alertas automáticas (navegador apagado)
# Cada 15 minutos en horario de mercado aproximado (Lun–Vie)

name: SMC Alerts

on:
  schedule:
    # Cada 15 min, lunes a viernes
    - cron: '*/15 * * * 1-5'
  workflow_dispatch: # botón "Run workflow" manual

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SMC alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          PAIRS: ${{ secrets.PAIRS }}
          TIMEFRAME: ${{ secrets.TIMEFRAME }}
          MIN_SCORE: ${{ secrets.MIN_SCORE }}
        run: node smc-alert-bot.js
